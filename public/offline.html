<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Hassan Digital Skills</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b1220;
      color: #fff;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 400px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
    button {
      background: linear-gradient(135deg, #3495eb 0%, #347ce0 100%);
      color: #fff;
      border: 0;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 48px; margin-bottom: 16px;">📡</div>
    <h1>You're Offline</h1>
    <p>
      Please check your internet connection and try again. Previously visited
      pages may still work.
    </p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
